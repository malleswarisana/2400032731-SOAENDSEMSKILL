
openapi: 3.0.3

info:
  title: Addition Microservice API
  version: 1.0.0
  description: GET endpoint contract

paths:
  /ms1/add:
    get:
      summary: Add two numbers

      parameters:
        - name: a
          in: query
          required: true
          schema:
            type: integer
          example: 5

        - name: b
          in: query
          required: true
          schema:
            type: integer
          example: 10

      responses:
        '200':
          description: Successful addition
          content:
            'text/plain;charset=UTF-8':
              schema:
                type: string
                example: "MS addition = 15"
